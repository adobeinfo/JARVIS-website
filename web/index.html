<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AE Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-inner">
                <div class="logo">
                    <span class="logo-icon">🎬</span>
                    <span class="logo-text">AE Market</span>
                </div>
                <button class="btn-icon search-toggle" onclick="showSearch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </button>
            </div>
        </header>

        <div id="search-panel" class="search-panel hidden">
            <div class="search-inner">
                <input type="text" id="search-input" class="search-input" placeholder="Поиск проектов..." oninput="debounceSearch()">
                <button class="btn-icon" onclick="hideSearch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>

        <main id="main-content" class="content">
            <div id="page-home" class="page active">
                <div class="banner" id="banner">
                    <div class="banner-content">
                        <h1 class="banner-title">After Effects Projects</h1>
                        <p class="banner-subtitle">Профессиональные шаблоны для моушн-дизайна</p>
                    </div>
                </div>
                <section class="section">
                    <h2 class="section-title">📂 Категории</h2>
                    <div class="categories-grid" id="categories-grid"></div>
                </section>
                <section class="section">
                    <div class="section-header">
                        <h2 class="section-title">🔥 Популярное</h2>
                        <button class="btn-link" onclick="loadPage('popular')">Все →</button>
                    </div>
                    <div class="projects-grid" id="popular-grid"></div>
                </section>
                <section class="section">
                    <div class="section-header">
                        <h2 class="section-title">⭐ Новинки</h2>
                        <button class="btn-link" onclick="loadPage('new')">Все →</button>
                    </div>
                    <div class="projects-grid" id="new-grid"></div>
                </section>
                <section class="section">
                    <div class="section-header">
                        <h2 class="section-title">💎 Premium</h2>
                        <button class="btn-link" onclick="loadPage('premium')">Все →</button>
                    </div>
                    <div class="projects-grid" id="premium-grid"></div>
                </section>
            </div>

            <div id="page-popular" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="loadPage('home')">←</button>
                    <h1>🔥 Популярное</h1>
                </div>
                <div class="projects-grid full" id="popular-full"></div>
            </div>

            <div id="page-new" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="loadPage('home')">←</button>
                    <h1>⭐ Новинки</h1>
                </div>
                <div class="projects-grid full" id="new-full"></div>
            </div>

            <div id="page-premium" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="loadPage('home')">←</button>
                    <h1>💎 Premium</h1>
                </div>
                <div class="projects-grid full" id="premium-full"></div>
            </div>

            <div id="page-category" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="loadPage('home')">←</button>
                    <h1 id="category-title">Категория</h1>
                </div>
                <div class="projects-grid full" id="category-projects"></div>
            </div>

            <div id="page-project" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="history.back()">←</button>
                    <h1 id="project-title">Проект</h1>
                </div>
                <div id="project-detail" class="project-detail"></div>
            </div>

            <div id="page-profile" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="loadPage('home')">←</button>
                    <h1>👤 Профиль</h1>
                </div>
                <div id="profile-content" class="profile-content"></div>
            </div>

            <div id="page-purchases" class="page">
                <div class="page-header">
                    <button class="btn-back" onclick="loadPage('home')">←</button>
                    <h1>📦 Мои покупки</h1>
                </div>
                <div id="purchases-content" class="purchases-content"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="loadPage('home')" data-page="home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span>Главная</span>
            </button>
            <button class="nav-item" onclick="loadPage('popular')" data-page="popular">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>Популярное</span>
            </button>
            <button class="nav-item" onclick="loadPage('new')" data-page="new">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span>Новинки</span>
            </button>
            <button class="nav-item" onclick="openTGApp('profile')" data-page="profile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()"></div>
    <div id="modal" class="modal hidden"></div>

    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
