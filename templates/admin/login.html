<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — JARVIS Admin</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070a;
      --line: rgba(255,255,255,0.08);
      --line-2: rgba(255,255,255,0.14);
      --glass: rgba(255,255,255,0.04);
      --glass-2: rgba(255,255,255,0.07);
      --text: #f5f5f7;
      --text-2: #c7c7cc;
      --text-3: #8e8e93;
      --accent: #6aa3ff;
      --accent-2: #14b8a6;
      --accent-3: #2dd4bf;
      --danger: #ff5e5e;
      --success: #34d399;
    }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.55;
    }
    body::before {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(106,163,255,0.45), transparent 70%);
      top: -250px; left: -200px;
    }
    body::after {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(177,140,255,0.35), transparent 70%);
      bottom: -200px; right: -200px;
    }
    a { color: inherit; text-decoration: none; }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 2.4rem 2.4rem 2rem;
      background: rgba(11,11,16,0.7);
      border: 1px solid var(--line-2);
      border-radius: 22px;
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 40px 100px -30px rgba(0,0,0,0.8);
    }
    .login-logo {
      width: 54px; height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      color: #0b0b10;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.05em;
      margin: 0 auto 1.2rem;
      box-shadow: 0 16px 40px -10px rgba(106,163,255,0.5);
    }
    .login-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.3rem;
    }
    .login-sub {
      text-align: center;
      color: var(--text-3);
      font-size: 0.88rem;
      margin-bottom: 2rem;
    }
    .field { margin-bottom: 1rem; }
    .label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-2);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .input {
      width: 100%;
      padding: 0.7rem 0.95rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .input:focus {
      outline: none;
      border-color: rgba(106,163,255,0.5);
      background: rgba(0,0,0,0.4);
    }
    .btn {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.85rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #fff 0%, #e9e9ee 100%);
      color: #0b0b10;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -10px rgba(255,255,255,0.35); }
    .btn:active { transform: scale(0.98); }
    .back {
      display: block;
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.82rem;
      color: var(--text-3);
      transition: color 0.2s;
    }
    .back:hover { color: var(--text); }

    .flash {
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      background: var(--glass-2);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      font-size: 0.88rem;
    }
    .flash.error, .flash.danger { border-left: 3px solid var(--danger); color: #ffb4b4; }
    .flash.success { border-left: 3px solid var(--success); }
  </style>
</head>
<body>
  <form class="login-card" method="POST" action="">
    <div class="login-logo">J</div>
    <div class="login-title">JARVIS Admin</div>
    <div class="login-sub">Панель управления</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="field">
      <label class="label">Логин</label>
      <input class="input" type="text" name="username" placeholder="admin" required autofocus />
    </div>
    <div class="field">
      <label class="label">Пароль</label>
      <input class="input" type="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn">Войти →</button>

    <a class="back" href="{{ url_for('index') }}">← На сайт</a>
  </form>
</body>
</html>
