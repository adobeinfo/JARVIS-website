{% extends 'base.html' %}
{% block title %}404 — Страница не найдена{% endblock %}
{% block content %}
<div style="text-align:center; padding: 5rem 1rem;">
  <div style="font-size:5rem; margin-bottom:1rem;">🔍</div>
  <h1 style="font-size:3rem; font-weight:800; color:var(--accent); margin-bottom:0.5rem;">404</h1>
  <p style="font-size:1.2rem; color:var(--muted); margin-bottom:2rem;">Страница не найдена</p>
  <p style="color:var(--muted); margin-bottom:2rem;">{{ error.description if error else 'Запрошенный ресурс не существует.' }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">← На главную</a>
</div>
{% endblock %}
