{% extends 'base.html' %}
{% block title %}404 — JARVIS не нашёл{% endblock %}
{% block content %}

<div class="error-page" style="min-height:70vh;display:grid;place-items:center;text-align:center;padding:2rem;">
  <div>
    <div style="font-size:6rem;line-height:1;margin-bottom:1rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent-2),var(--accent-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">
      404
    </div>
    <div style="font-size:1.1rem;color:var(--text-3);margin-bottom:.5rem;">
      JARVIS обыскал всё — такой страницы нет.
    </div>
    <div style="font-size:.85rem;color:var(--text-4);margin-bottom:2rem;max-width:400px;">
      Возможно, ты просто перепутал букву. Или это я вчера перепил и удалил не то. Бывает.
    </div>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">← На главную</a>
    <button onclick="document.body.style.background='#000';document.body.innerHTML='<div style=\'display:grid;place-items:center;height:100vh;color:#0f0;font-family:monospace;font-size:2rem;\'>Ну ты и хакер... зачем ломать мой сайт?</div>'" style="background:none;border:none;color:transparent;cursor:default;position:absolute;bottom:20px;right:20px;font-size:10px;">.</button>
  </div>
</div>

<script>
(function(){
  var msgs = [
    "P.S. Кстати, админки тут нет. Совсем.",
    "P.P.S. Шучу. Она есть. Но я тебе не скажу где.",
    "P.P.P.S. Ладно, /admin. Но пароль я забыл.",
    "А ещё JARVIS умеет делать кофе. Ну, почти.",
    "Знаешь анекдот про 404? Я тоже нет. Грустно.",
  ];
  var el = document.createElement('div');
  el.style.cssText = 'margin-top:2rem;font-size:.8rem;color:var(--text-4);max-width:400px;';
  el.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  document.querySelector('.error-page > div').appendChild(el);
})();
</script>

{% endblock %}
